services:
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    volumes:
      - ../:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: db_sidowcash
      DB_USERNAME: user
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ../:/var/www:ro
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    image: node:20-alpine
    working_dir: /var/www
    volumes:
      - ..:/var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d store"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: